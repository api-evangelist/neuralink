name: Neuralink
description: 'Neuralink is a neurotechnology company pioneering implantable brain-computer interfaces (BCIs)
  intended to restore autonomy to people with unmet medical needs and, longer term, to expand human capability.
  Its flagship device, the N1 Implant, is a surgically embedded array of thin, flexible threads placed by a
  purpose-built surgical robot to record and stimulate neural activity, paired with an app that lets users
  control external devices. Neuralink is a frontier-tech company backed by Craft Ventures, Founders Fund, GV
  and Lightspeed Venture Partners. It publishes no public developer API, SDK, or developer portal; its only
  public machine-readable surfaces are a security.txt vulnerability-disclosure record and standard web/DNS
  security posture. This profile was surfaced from VC portfolio data and enriched with real probed security
  artifacts.'
